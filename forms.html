<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Formulaires</title></head><body>
<!-- Déclaration statique des formulaires pour la détection Netlify Forms -->
<form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden><input name="nom"><input name="prenom"><input name="email"><input name="telephone"><textarea name="message"></textarea><input name="bot-field"></form>
<form name="freebie" data-netlify="true" hidden><input name="prenom"><input name="email"></form>
<form name="newsletter" data-netlify="true" hidden><input name="email"></form>
<form name="commentaire" data-netlify="true" hidden><input name="nom"><textarea name="commentaire"></textarea></form>
</body></html>
